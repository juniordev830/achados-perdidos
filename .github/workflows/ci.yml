name: PHP lint and domain tests

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - run: php -l main.php
      - run: php -l reports.php
      - run: php -l src/CatalogReports.php
      - run: php -l tests/ReportsTest.php
      - run: php main.php --self-test
      - run: php tests/ReportsTest.php
      - run: php reports.php --help
      - run: php -l operations.php
      - run: php -l src/Operations.php
      - run: php -l tests/OperationsTest.php
      - run: php -l tests/OperationsCliTest.php
      - run: php tests/OperationsTest.php
      - run: php tests/OperationsCliTest.php
      - run: php operations.php --help
      - run: php -l src/ReturnReceipt.php
      - run: php -l tests/return_receipt_test.php
      - run: php tests/return_receipt_test.php
