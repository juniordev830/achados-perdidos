name: PHP lint and domain tests

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - run: php -l main.php
      - run: php -l reports.php
      - run: php -l src/CatalogReports.php
      - run: php -l tests/ReportsTest.php
      - run: php main.php --self-test
      - run: php tests/ReportsTest.php
      - run: php reports.php --help
